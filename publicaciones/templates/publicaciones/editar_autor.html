{% extends 'publicaciones/base.html' %}

{% block title %}
Editar Autor
{% endblock %}

{% block content %}
<h2>Editar Autor</h2>
<h5>{{autor.nombre}}{{autor.apellido}}</h5>
{% if autor.avatar %}
    <img src="{{autor.avatar.url}}" alt="" width="120" height="120">
{% endif %}
<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    {{formulario.as_p}}
    <button type="submit">Guardar cambios</button>
    <a href="{% url 'lista_autores' %}">Cancelar</a>
</form>

{% endblock %}
