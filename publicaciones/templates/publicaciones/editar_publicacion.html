{% extends 'publicaciones/base.html' %}

{% block title %}
Editar Publicacion
{% endblock %}

{% block content %}
  <h2>Editar publicacion</h2>
    <form method="POST">
        {% csrf_token %}
        <label>Titulo:</label>
        <input type="text" name="titulo" value={{ publicacion.titulo }} required>
        <br><br>
        <label>Descripcion:</label>
        <textarea name="descripcion" required>{{ publicacion.descripcion }}</textarea>
        <br><br>
        <label>Autor:</label>
        <input type="text" name="autor"  value={{ publicacion.autor }} required>
        <br><br>
        <label>Estado:</label>
        <select name="estado">
            <option value="borrador"{% if publicacion.estado == "borrador"%}selected{% endif%}>Borrador</option>
            <option value="archivado"{% if publicacion.estado == "archivado"%}selected{% endif%}>Archivado</option>
            <option value="publicado"{% if publicacion.estado == "publicado"%}selected{% endif%}>Publicado</option>
        </select>
        <br><br>
        <button type="submit">Guardar publicacion</button>

    </form>
    <a href="{% url 'lista_publicaciones' %}">Volver</a>
{% endblock %}
