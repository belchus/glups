{% extends 'publicaciones/base.html' %}

{% block title %}
Editar publicion
{% endblock %}

{% block content %}
  <h2>Editar publicacion</h2>
  {%if publicacion.imagen %}
  <img src="{{publicacion.imagen.url}}" alt="" width="250">
  {% endif %}
  
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {{formulario.as_p}}
        <button type="submit">Crear publicacion</button>

    </form>
    <a href="{% url 'lista_publicaciones' %}">Volver</a>
{% endblock %}
